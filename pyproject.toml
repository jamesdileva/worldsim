[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldsim"
version = "0.1.0"
description = "Autonomous AI civilization simulator - Sprint 1: world generation & terrain"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opensimplex>=0.4.5",
    "gymnasium>=0.29",
    "matplotlib>=3.8",
    "stable-baselines3>=2.3",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running integration tests (benchmarks, multi-hundred-tick simulations)",
]
addopts = "-m 'not slow'"
